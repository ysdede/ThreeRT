name: demos

# The demo pages (demos/): the engine's browser module, the demos' games and pages, built here and published with GitHub
# Pages. A pull request builds them; a push to main builds and deploys them.
on:
  push:
    branches: [main]
    paths:
      - demos/**
      - renderer/**
      - packages/**
      - tools/bundle-game.ts
      - tools/fetch-polyhaven.ts
      - package.json
      - package-lock.json
      - rust-toolchain.toml
      - .github/workflows/demos.yml
  pull_request:
    paths:
      - demos/**
      - .github/workflows/demos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "build: engine module, pages"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p demos
      - run: rustup target add wasm32-unknown-unknown
      - uses: ./.github/actions/cargo-cache
        with:
          workspaces: renderer/web
      # wasm-bindgen's CLI writes the module's JavaScript; its version is the crate's (renderer/web/Cargo.toml).
      - id: bindgen
        run: echo "version=$(grep -o 'wasm-bindgen = "=[0-9.]*"' renderer/web/Cargo.toml | grep -o '[0-9][0-9.]*')" >> "$GITHUB_OUTPUT"
      - id: bindgen-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ steps.bindgen.outputs.version }}
      - if: steps.bindgen-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.bindgen.outputs.version }}
        run: cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - run: node demos/build.ts
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/demos

  deploy:
    name: "deploy: GitHub Pages"
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
