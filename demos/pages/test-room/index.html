<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ThreeRT Test Room</title>
<style>
  @font-face { font-family: "Rubik"; src: url("../fonts/rubik-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; }
  :root {
    --bg-app: #191919; --bg-panel: #202020; --bg-raised: #2d2d2d; --border: #383838;
    --text: #eeeeee; --text-muted: #b8b8b8; --accent: #de864f; --accent-text: #ffb58c; --danger: #f47a7a; --ok: #65c58d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg-app); color: var(--text); font: 13px/1.4 "Rubik", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 40px 1fr; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #stats { display: flex; gap: 16px; font-variant-numeric: tabular-nums; color: var(--text-muted); }
  #stats b { color: var(--text); font-weight: 500; }
  #stats .bad { color: var(--danger); }
  aside { background: var(--bg-panel); border-right: 1px solid var(--border); padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  section h2 { font-size: 12px; font-weight: 500; color: var(--text-muted); margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: 74px 1fr 44px; align-items: center; gap: 8px; height: 30px; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggle { display: flex; justify-content: space-between; align-items: center; height: 30px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button { height: 30px; border-radius: 3px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text); font: inherit; cursor: pointer; }
  button[aria-pressed=true] { border-color: var(--accent); color: var(--accent-text); }
  button.primary { background: var(--accent); color: #17191c; border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; padding: 10px; }
  #view { width: 100%; height: 100%; object-fit: contain; aspect-ratio: 4 / 3; max-height: 100%; }
  #status { display: none; }
  #bench { color: var(--text-muted); font-variant-numeric: tabular-nums; min-height: 18px; }
</style>
</head>
<body data-assets="../" data-width="960" data-height="720">
<script src="../loader.js"></script>
  <header>
    <h1>ThreeRT Test Room</h1>
    <div id="stats">
      <span>Path <b id="s-path">—</b></span>
      <span>FPS <b id="s-fps">—</b></span>
      <span>GPU <b id="s-gpu">—</b></span>
      <span>Trace <b id="s-trace">—</b></span>
      <span>Scale <b id="s-scale">—</b></span>
      <span>Guard <b id="s-guard">—</b></span>
      <span id="s-adapter">—</span>
    </div>
  </header>
  <aside>
    <section>
      <h2>Chrome sphere</h2>
      <div class="row"><label for="rough">Roughness</label><input id="rough" type="range" min="0" max="1" step="0.01" value="0.02" /><output id="o-rough">0.02</output></div>
      <div class="row"><label for="metal">Metallic</label><input id="metal" type="range" min="0" max="1" step="0.01" value="1" /><output id="o-metal">1.00</output></div>
    </section>
    <section>
      <h2>Glass sphere</h2>
      <div class="row"><label for="ior">IOR</label><input id="ior" type="range" min="1" max="2.4" step="0.01" value="1.5" /><output id="o-ior">1.50</output></div>
    </section>
    <section>
      <h2>Lamp</h2>
      <div class="row"><label for="lamp">Power</label><input id="lamp" type="range" min="0.1" max="3" step="0.05" value="1" /><output id="o-lamp">1.00</output></div>
    </section>
    <section>
      <h2>Scene</h2>
      <div class="toggle"><span>Motion</span><button id="motion" aria-pressed="true">On</button></div>
    </section>
    <section>
      <h2>Rendering</h2>
      <div class="toggle"><span>Path tracing</span><button id="rays" aria-pressed="true">On</button></div>
      <div class="toggle"><span>Denoiser</span><button id="denoise" aria-pressed="true">On</button></div>
      <div class="row"><label for="bounces">Bounces</label><input id="bounces" type="range" min="1" max="8" step="1" value="4" /><output id="o-bounces">4</output></div>
      <div class="row"><label for="scale">Scale</label><input id="scale" type="range" min="0" max="1" step="0.05" value="0" /><output id="o-scale">Auto</output></div>
    </section>
    <section>
      <h2>View</h2>
      <div class="modes" id="modes">
        <button data-mode="0" aria-pressed="true">Beauty</button>
        <button data-mode="1">Albedo</button>
        <button data-mode="2">Normals</button>
        <button data-mode="8">Direct</button>
        <button data-mode="6">Diffuse</button>
        <button data-mode="7">Specular</button>
        <button data-mode="4">Raw sample</button>
        <button data-mode="5">History</button>
      </div>
    </section>
    <section>
      <h2>Benchmark</h2>
      <button id="run-bench" class="primary" style="width:100%">Run 10 s at scale 1</button>
      <div id="bench"></div>
    </section>
  </aside>
  <main>
    <canvas id="view" width="960" height="720"></canvas>
    <div id="status">loading</div>
  </main>
  <script type="module" src="../main.js"></script>
  <script>
    // Every control calls the ThreeRT browser engine: events go to the game's `set` handler (the frame script writes
    // materials and the light), the rest to the live core (setRays, setViewMode, setBounces, setScale).
    const $ = (id) => document.getElementById(id);
    const ready = () => window.threert && typeof window.threert.setViewMode === "function";
    let mode = 0, denoise = true;
    const applyMode = () => window.threert.setViewMode(mode === 0 && !denoise ? 3 : mode);

    for (const [id, key] of [["rough", "roughness"], ["metal", "metalness"], ["ior", "ior"], ["lamp", "lamp"]]) {
      $(id).addEventListener("input", () => {
        const v = Number($(id).value);
        $("o-" + id).textContent = v.toFixed(2);
        if (ready()) window.threert.event("set", { [key]: v });
      });
    }
    $("motion").addEventListener("click", () => {
      const on = $("motion").getAttribute("aria-pressed") !== "true";
      $("motion").setAttribute("aria-pressed", String(on));
      $("motion").textContent = on ? "On" : "Off";
      if (ready()) window.threert.event("set", { motion: on ? 1 : 0 });
    });
    $("rays").addEventListener("click", () => {
      const on = $("rays").getAttribute("aria-pressed") !== "true";
      $("rays").setAttribute("aria-pressed", String(on));
      $("rays").textContent = on ? "On" : "Off";
      if (ready()) window.threert.setRays(on);
    });
    $("denoise").addEventListener("click", () => {
      denoise = $("denoise").getAttribute("aria-pressed") !== "true";
      $("denoise").setAttribute("aria-pressed", String(denoise));
      $("denoise").textContent = denoise ? "On" : "Off";
      if (ready()) applyMode();
    });
    $("bounces").addEventListener("input", () => { $("o-bounces").textContent = $("bounces").value; if (ready()) window.threert.setBounces(Number($("bounces").value)); });
    $("scale").addEventListener("input", () => {
      const v = Number($("scale").value);
      $("o-scale").textContent = v === 0 ? "Auto" : v.toFixed(2);
      if (ready()) window.threert.setScale(v);
    });
    $("modes").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-mode]");
      if (!b) return;
      mode = Number(b.dataset.mode);
      for (const x of $("modes").querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
      if (ready()) applyMode();
    });

    // Stats from the engine's own frame records (window.threert.frames).
    const med = (a) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)] ?? 0; };
    const p95 = (a) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length * 0.95)] ?? 0; };
    setInterval(() => {
      const f = window.threert?.frames;
      if (!f || f.length < 3) { $("s-path").textContent = f ? "compiling" : "loading"; return; }
      const r = f.slice(-60);
      $("s-path").textContent = $("rays").getAttribute("aria-pressed") === "true" ? "traced" : "camera rays only";
      $("s-fps").textContent = (1000 / (r.reduce((a, x) => a + x.interval, 0) / r.length)).toFixed(0);
      $("s-gpu").textContent = med(r.map((x) => x.gpu_ms)).toFixed(1) + " ms";
      $("s-trace").textContent = med(r.map((x) => x.trace_ms)).toFixed(1) + " ms";
      $("s-scale").textContent = r.at(-1).scale.toFixed(2);
      const g = r.at(-1).guard_trips;
      $("s-guard").textContent = g ?? "—";
      $("s-guard").className = g ? "bad" : "";
      const a = window.threert.info?.adapter;
      if (a) $("s-adapter").textContent = `${a.name} · ${a.backend} · software BVH`;
    }, 500);

    // Benchmark: fixed scale 1, 10 s, median and p95 of the engine's frame records; downloads a JSON report.
    $("run-bench").addEventListener("click", async () => {
      if (!ready()) return;
      const t = window.threert;
      t.setScale(1);
      $("bench").textContent = "warming up…";
      await new Promise((r) => setTimeout(r, 2000));
      const start = t.frames.length;
      $("bench").textContent = "measuring 10 s…";
      await new Promise((r) => setTimeout(r, 10000));
      const rows = t.frames.slice(start);
      const report = {
        scene: "test-room", renderer: "ThreeRT browser (wasm + WebGPU, software BVH)", revision: "48b7e6f + fix/wgsl + feat/web-diagnostics",
        adapter: t.info?.adapter, userAgent: navigator.userAgent, viewport: [960, 720], scale: 1, frames: rows.length,
        gpu_ms: { median: med(rows.map((x) => x.gpu_ms)), p95: p95(rows.map((x) => x.gpu_ms)) },
        trace_ms: { median: med(rows.map((x) => x.trace_ms)), p95: p95(rows.map((x) => x.trace_ms)) },
        interval_ms: { median: med(rows.map((x) => x.interval)), p95: p95(rows.map((x) => x.interval)) },
        rebuilt_frames: rows.filter((x) => x.rebuilt).length,
        guard_trips: rows.at(-1)?.guard_trips ?? null,
      };
      window.lastBenchmark = report;
      $("bench").textContent = `GPU ${report.gpu_ms.median.toFixed(1)} / ${report.gpu_ms.p95.toFixed(1)} ms · ${rows.length} frames`;
      const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: "application/json" }));
      Object.assign(document.createElement("a"), { href: url, download: "test-room-benchmark.json" }).click();
      t.setScale(Number($("scale").value));
    });
  </script>
</body>
</html>
